workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output2.txt
          echo "=== SupabaseClientProvider.kt (full file) ===" > $OUT
          find . -name "SupabaseClientProvider.kt" -exec cat {} \; >> $OUT
          echo "" >> $OUT
          echo "=== sessionStatus / awaitInitialization mentions ===" >> $OUT
          grep -rn "sessionStatus\|awaitInitialization\|SessionStatus" --include="*.kt" . >> $OUT || echo "NO MATCHES" >> $OUT
          echo "" >> $OUT
          echo "=== cold-start / saved-session restore call sites ===" >> $OUT
          grep -rn -B 15 -A 15 "getSavedSession\|selectCharacter(" --include="*.kt" ./app/src/main/kotlin/com/yourname/idlerpg/MainActivity.kt >> $OUT || echo "NO MATCHES IN MainActivity" >> $OUT
          grep -rn -B 15 "selectCharacter(" --include="*.kt" ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt | grep -B 15 "init {" >> $OUT || true
    artifacts:
      - discovery_output2.txt
