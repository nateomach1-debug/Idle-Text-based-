workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output88.txt
          echo "=== reusable quantity stepper composable, if any ===" > $OUT
          grep -rln "QuantityStepper\|fun.*QuantityPicker\|Max\" \|onClick.*[Mm]ax" ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== GuildHomeScreen( call site in MainActivity.kt ===" >> $OUT
          grep -n "GuildHomeScreen(" -B 5 -A 20 ./app/src/main/kotlin/com/yourname/idlerpg/MainActivity.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== how to query quantity of an item in inventory ===" >> $OUT
          grep -n "fun quantityOf\|fun quantityFor\|entries\[itemId\]" ./app/src/main/kotlin/com/yourname/idlerpg/ItemsEquipmentSystem.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== an existing bury-queue quantity stepper UI, for style reference ===" >> $OUT
          grep -rln "buryActionProgressSeconds\|BuryQueue\|bury" ./app/src/main/kotlin/com/yourname/idlerpg/*Screen.kt >> $OUT || echo "NOT FOUND" >> $OUT
    artifacts:
      - discovery_output88.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_bury_queue_and_prayer.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
