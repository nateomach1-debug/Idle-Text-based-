workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output177.txt

          echo "=== A. MainActivity class declaration + onCreate start ===" > $OUT
          grep -n "class MainActivity" -A 15 ./app/src/main/kotlin/com/yourname/idlerpg/MainActivity.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== B. GameViewModel: how it references AccountCharacterSystem / current account / accountId ===" >> $OUT
          grep -n "AccountCharacterSystem\|currentAccount\|val account\|_currentAccountId\|accountId" ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== C. GameStateRepository save trigger function (how/when saves happen) ===" >> $OUT
          grep -n "fun save\|saveGameState\|fun persist" ./app/src/main/kotlin/com/yourname/idlerpg/GameStateRepository.kt ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== D. Full SettingsScreen.kt (or wherever the RGB slider/glow toggle UI lives) ===" >> $OUT
          grep -rln "RGB\|glowEnabled\|hexInput\|colorOverride" ./app/src/main/kotlin/com/yourname/idlerpg/*.kt >> $OUT || echo "NOT FOUND (filename)" >> $OUT
    artifacts:
      - discovery_output177.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_all_skill_backgrounds.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
