workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output201.txt
          echo "=== Compose/Material3 versions (version catalog) ===" > $OUT
          find . -iname "libs.versions.toml" -exec grep -Hn "compose\|material3" {} \; >> $OUT
          echo "" >> $OUT
          echo "=== displayName render sites (chat, character select, etc) ===" >> $OUT
          grep -rn "\.displayName" ./app/src/main/kotlin/com/yourname/idlerpg/*.kt >> $OUT
          echo "" >> $OUT
          echo "=== ChatScreen.kt message row rendering (if exists) ===" >> $OUT
          find . -iname "ChatScreen.kt" -exec cat {} \; >> $OUT
    artifacts:
      - discovery_output201.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_all_skill_backgrounds.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
