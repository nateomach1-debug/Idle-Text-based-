workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output3.txt
          echo "=== SupabaseClientProvider actual definition (wherever it lives) ===" > $OUT
          grep -rn -B 5 -A 30 "object SupabaseClientProvider" --include="*.kt" . >> $OUT || echo "NO MATCHES" >> $OUT
          echo "" >> $OUT
          echo "=== GameViewModel.kt sessionStatus listener, full context ===" >> $OUT
          sed -n '780,830p' ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== MainActivity.kt flowState initial value / startup logic ===" >> $OUT
          grep -n "var flowState\|flowState =\|hasSavedSession\|getSavedSession\|AppFlowState.InGame\|AppFlowState.CharacterSelect" ./app/src/main/kotlin/com/yourname/idlerpg/MainActivity.kt >> $OUT
          echo "" >> $OUT
          echo "=== MainActivity.kt top-level LaunchedEffect(Unit) blocks, full context ===" >> $OUT
          grep -n -B 2 -A 40 "LaunchedEffect(Unit)" ./app/src/main/kotlin/com/yourname/idlerpg/MainActivity.kt >> $OUT
    artifacts:
      - discovery_output3.txt

  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch script
        script: python3 patch_fix_character_sync_race.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt
          git commit -m "Fix character sync race condition on cold start"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
