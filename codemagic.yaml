workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output63.txt
          echo "=== MainActivity lines 355-392: full flowState computation + where currentCharacterId local var comes from ===" > $OUT
          sed -n '355,392p' ./app/src/main/kotlin/com/yourname/idlerpg/MainActivity.kt >> $OUT
          echo "" >> $OUT
          echo "=== GameViewModel init block - does it set _currentCharacterId synchronously before loadGame() runs? ===" >> $OUT
          grep -n "^class GameViewModel\|init {" -A 40 ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== where does the persisted 'last active character id' get read from disk, if anywhere ===" >> $OUT
          grep -rn "getSavedCharacterId\|lastActiveCharacter\|KEY_CHARACTER_ID\|saveCharacterSession\|currentCharacterId" ./app/src/main/kotlin/com/yourname/idlerpg/SessionManager.kt >> $OUT
          echo "" >> $OUT
          echo "=== full SessionManager.kt (in case currentCharacterId persistence lives here under a different name) ===" >> $OUT
          cat ./app/src/main/kotlin/com/yourname/idlerpg/SessionManager.kt >> $OUT
          echo "" >> $OUT
          echo "=== default initial value of _trainingSkill StateFlow ===" >> $OUT
          grep -n "_trainingSkill = \|_trainingSkill(" ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== any LaunchedEffect in the Loadout/combat screen composable that could call setTrainingSkill on first composition ===" >> $OUT
          grep -rn "setTrainingSkill" ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT
    artifacts:
      - discovery_output63.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_bury_queue_and_prayer.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
