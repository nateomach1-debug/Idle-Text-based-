workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output212.txt
          echo "=== Monster catalog full listing (names/stats) ===" > $OUT
          grep -n "Monster(" -A 8 ./app/src/main/kotlin/com/yourname/idlerpg/CombatSystem.kt >> $OUT 2>/dev/null || true
          echo "" >> $OUT
          echo "=== equippedWeapon function full body ===" >> $OUT
          grep -n "fun equippedWeapon" -A 25 ./app/src/main/kotlin/com/yourname/idlerpg/CombatSystem.kt >> $OUT 2>/dev/null || true
          echo "" >> $OUT
          echo "=== tickCombat function full body ===" >> $OUT
          grep -n "fun tickCombat" -A 90 ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT 2>/dev/null || true
          echo "" >> $OUT
          echo "=== The 13 elemental magic weapon ids/names only (compact) ===" >> $OUT
          grep -n "id = \"fire_\|id = \"earth_\|id = \"water_\|id = \"wind_" ./app/src/main/kotlin/com/yourname/idlerpg/GeneratedItemCatalog.kt >> $OUT 2>/dev/null || true
    artifacts:
      - discovery_output212.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_G_gradient_animated_text.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
