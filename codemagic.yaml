workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output8.txt
          echo "=== full FARMING section of ActionCatalog.kt ===" > $OUT
          grep -n "SkillType.FARMING" ./app/src/main/kotlin/com/yourname/idlerpg/ActionCatalog.kt >> $OUT
          echo "" >> $OUT
          echo "=== full COOKING section of ActionCatalog.kt ===" >> $OUT
          grep -n "SkillType.COOKING" ./app/src/main/kotlin/com/yourname/idlerpg/ActionCatalog.kt >> $OUT
          echo "" >> $OUT
          echo "=== apple / apple_sapling / meat_pie / pie_shell full ItemDefinition blocks ===" >> $OUT
          grep -n -B 2 -A 10 'id = "apple"\|id = "apple_sapling"\|id = "meat_pie"\|id = "pie_shell"' ./app/src/main/kotlin/com/yourname/idlerpg/GeneratedItemCatalog.kt >> $OUT
          echo "" >> $OUT
          echo "=== the price/cost map containing apple and apple_sapling (context around it) ===" >> $OUT
          sed -n '2700,2790p' ./app/src/main/kotlin/com/yourname/idlerpg/GeneratedItemCatalog.kt >> $OUT
    artifacts:
      - discovery_output8.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch script
        script: python3 patch_fix_character_sync_race.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt
          git commit -m "Fix character sync race condition on cold start"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
