workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output170.txt

          echo "=== A. Offline progress calculation (elapsed time / cap / rate logic) ===" > $OUT
          grep -rln "offline" ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          grep -rn "fun.*[Oo]ffline" -A 5 ./app/src/main/kotlin/com/yourname/idlerpg/*.kt >> $OUT || echo "NOT FOUND (function names)" >> $OUT
          echo "" >> $OUT
          grep -rn "maxOfflineSeconds\|MAX_OFFLINE\|offlineCapSeconds\|offlineCapHours\|coerceAtMost.*offline\|offline.*coerceAtMost" ./app/src/main/kotlin/com/yourname/idlerpg/*.kt >> $OUT || echo "NOT FOUND (cap constant)" >> $OUT
          echo "" >> $OUT

          echo "=== B. placeBuyOrder / placeSellOrder in GameViewModel.kt ===" >> $OUT
          grep -n "fun placeBuyOrder\|fun placeSellOrder" -A 20 ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== C. Leaderboards screen row rendering ===" >> $OUT
          grep -rln "Leaderboard" ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          grep -rn "fun LeaderboardRow\|fun.*LeaderboardEntry\|rank ==\|rank <=" -A 10 ./app/src/main/kotlin/com/yourname/idlerpg/*.kt >> $OUT || echo "NOT FOUND (row fn)" >> $OUT
    artifacts:
      - discovery_output170.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_all_skill_backgrounds.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
