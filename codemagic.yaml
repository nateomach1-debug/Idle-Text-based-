workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output68.txt
          echo "=== fun resolveAttack() in CombatSystem.kt ===" > $OUT
          grep -n "fun resolveAttack" -A 40 ./app/src/main/kotlin/com/yourname/idlerpg/CombatSystem.kt >> $OUT || echo "NOT FOUND HERE" >> $OUT
          echo "" >> $OUT
          echo "=== search all files for fun resolveAttack, in case it lives elsewhere ===" >> $OUT
          grep -rn "fun resolveAttack" ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NOT FOUND ANYWHERE" >> $OUT
          echo "" >> $OUT
          echo "=== combatService class - what file/class is 'combatService' actually an instance of ===" >> $OUT
          grep -n "val combatService" ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT || true
          echo "" >> $OUT
          echo "=== attackSpeedSeconds usage anywhere in combat resolution logic ===" >> $OUT
          grep -rn "attackSpeedSeconds" ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NO MATCHES" >> $OUT
    artifacts:
      - discovery_output68.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_bury_queue_and_prayer.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
