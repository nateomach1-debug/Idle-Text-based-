workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output300.txt
          SRC=./app/src/main/kotlin/com/yourname/idlerpg
          echo "=== patch_L landed? DamageType ===" > $OUT
          grep -rn "DamageType" $SRC --include=*.kt | head -60 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== patch_L: wasWeaknessHit / Super effective ===" >> $OUT
          grep -rn "wasWeaknessHit\|Super effective" $SRC --include=*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== patch scripts in repo root ===" >> $OUT
          ls ./*.py >> $OUT 2>&1 || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== ZoneSelectScreen.kt path ===" >> $OUT
          find ./app -name "ZoneSelectScreen.kt" >> $OUT
          echo "" >> $OUT
          echo "=== ZoneSelectScreen.kt full ===" >> $OUT
          cat $(find ./app -name "ZoneSelectScreen.kt" | head -1) >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== package lines ===" >> $OUT
          grep -n "^package" $SRC/CombatSystem.kt $SRC/GameViewModel.kt $SRC/SharedTypes.kt >> $OUT
          echo "" >> $OUT
          echo "=== data class Monster + zone class ===" >> $OUT
          grep -rn "data class Monster\|data class CombatZone\|data class Zone" -A 22 $SRC --include=*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== zone catalog (monsterNames) ===" >> $OUT
          grep -rn "monsterNames" -B 12 -A 6 $SRC --include=*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== Monster( catalog entries ===" >> $OUT
          grep -n "Monster(" -A 16 $SRC/CombatSystem.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== zone entry / random pick logic ===" >> $OUT
          grep -rn "startSearching\|enterCombatZone\|enterZone\|selectZone\|randomOrNull\|\.random()\|findMonster\|pickMonster" -B 4 -A 14 $SRC/GameViewModel.kt $SRC/CombatSystem.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== state/UI files referencing zones ===" >> $OUT
          grep -rln "ZoneSelect\|InZone\|CombatUiState\|leaveCombatZone" $SRC --include=*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== ZoneSelectScreen call site + InZone state ===" >> $OUT
          grep -rn "ZoneSelectScreen(\|InZone" -B 3 -A 10 $SRC/MainActivity.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== files referencing monsters (id/name/catalog) ===" >> $OUT
          grep -rln "monsterId\|MonsterCatalog\|monsters\b" $SRC --include=*.kt >> $OUT || echo "NOT FOUND" >> $OUT
    artifacts:
      - discovery_output300.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_L_elemental_weakness.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
