workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output303.txt
          SRC=./app/src/main/kotlin/com/yourname/idlerpg
          echo "=== chat-related files ===" > $OUT
          find ./app -name "*Chat*" >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== chat data classes ===" >> $OUT
          grep -rn "class ChatMessageUi\|class ChatChannelUi\|class DmConversationSummary\|class ChatMessage\|class ChatMessageRow" -A 18 $SRC --include=*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== Supabase chat repository (full) ===" >> $OUT
          for f in $(find ./app -name "Supabase*Chat*.kt"); do echo "--- $f" >> $OUT; cat "$f" >> $OUT; done
          echo "" >> $OUT
          echo "=== ChatMessageUi usages ===" >> $OUT
          grep -rn "ChatMessageUi" $SRC --include=*.kt | head -40 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== sender name usages ===" >> $OUT
          grep -rn -i "sendername\|authorname\|sender_name\|characterName" $SRC ./*.sql --include=*.kt --include=*.sql | head -70 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== chat SQL lines ===" >> $OUT
          grep -n -i "chat\|dm_" ./*.sql | head -150 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== chat SQL function bodies ===" >> $OUT
          grep -n -i "function.*chat\|function.*dm" -A 45 ./*.sql | head -350 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== characters table SQL ===" >> $OUT
          grep -n -i "table.*characters" -A 25 ./*.sql | head -100 >> $OUT || echo "NOT FOUND" >> $OUT
          grep -n -i "alter table.*characters" ./*.sql >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== moderator indicators ===" >> $OUT
          grep -rn "isModerator" $SRC --include=*.kt | head -30 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== purchasePreset (gem purchase pattern) ===" >> $OUT
          grep -n "fun purchasePreset" -A 45 $SRC/GameViewModel.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== unlockedPresets usages ===" >> $OUT
          grep -rn "unlockedPresets" $SRC --include=*.kt | head -40 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== PremiumPreset catalog ===" >> $OUT
          grep -n "class PremiumPreset\|object PremiumPresetCatalog" -A 30 $SRC/MonetizationSystem.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== Theme effect code ===" >> $OUT
          grep -n "enum class TextEffectMode\|fun resolvedTextColorAndBrush\|fun styledText\|rememberInfiniteTransition" -A 30 $SRC/Theme.kt | head -220 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== GameViewModel chat functions ===" >> $OUT
          grep -n "chat\|Chat" $SRC/GameViewModel.kt | head -80 >> $OUT || echo "NOT FOUND" >> $OUT
    artifacts:
      - discovery_output303.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_L_elemental_weakness.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
