workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output110.txt
          echo "=== Full AppDestination.kt ===" > $OUT
          find ./app/src/main/kotlin/com/yourname/idlerpg/ui/navigation -type f -name "*.kt" -exec echo "--- {} ---" \; -exec cat {} \; >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== SideRail call site in MainActivity.kt (with context) ===" >> $OUT
          grep -n "SideRail(" -B 5 -A 20 ./app/src/main/kotlin/com/yourname/idlerpg/MainActivity.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== Top of the currentDestination when-dispatch block ===" >> $OUT
          grep -n "when (currentDestination)\|currentDestination ==" ./app/src/main/kotlin/com/yourname/idlerpg/MainActivity.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== AppDestination usages across the codebase ===" >> $OUT
          grep -rn "AppDestination\." ./app/src/main/kotlin/com/yourname/idlerpg/*.kt ./app/src/main/kotlin/com/yourname/idlerpg/ui/navigation/*.kt >> $OUT || echo "NOT FOUND" >> $OUT
    artifacts:
      - discovery_output110.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_bury_queue_and_prayer.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
