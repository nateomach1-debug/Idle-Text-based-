workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output132.txt
          echo "=== Count of Text( calls across the app, and how many pass explicit color= ===" > $OUT
          grep -rc "Text(" ./app/src/main/kotlin/com/yourname/idlerpg/*.kt | awk -F: '{sum+=$2} END {print "total Text( calls:", sum}' >> $OUT
          grep -rc "color = " ./app/src/main/kotlin/com/yourname/idlerpg/*.kt | awk -F: '{sum+=$2} END {print "total color= usages (all composables, not just Text):", sum}' >> $OUT
          echo "" >> $OUT
          echo "=== Theme.kt: MaterialTheme / colorScheme setup ===" >> $OUT
          grep -n "MaterialTheme\|colorScheme\|ColorScheme\|LocalContentColor\|LocalTextStyle" ./app/src/main/kotlin/com/yourname/idlerpg/Theme.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== Top-level app theme wrapper (where MaterialTheme { ... } wraps everything) ===" >> $OUT
          grep -rn "fun.*Theme(\|MaterialTheme(" ./app/src/main/kotlin/com/yourname/idlerpg/Theme.kt ./app/src/main/kotlin/com/yourname/idlerpg/MainActivity.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== Existing persisted settings/preferences mechanism (SharedPreferences/DataStore) ===" >> $OUT
          grep -rln "SharedPreferences\|DataStore\|dataStore" ./app/src/main/kotlin/com/yourname/idlerpg/*.kt >> $OUT || echo "NOT FOUND" >> $OUT
    artifacts:
      - discovery_output132.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_all_skill_backgrounds.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
