workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output304.txt
          SRC=./app/src/main/kotlin/com/yourname/idlerpg
          echo "=== package lines ===" > $OUT
          grep -n "^package" $SRC/ChatBanner.kt $SRC/SettingsScreen.kt $SRC/ReportMessageDialog.kt $SRC/MonetizationSystem.kt $SRC/AccountCharacterSystem.kt $SRC/SupabaseMarketRepository.kt $SRC/SupabaseLeaderboardRepository.kt >> $OUT
          echo "" >> $OUT
          echo "=== ChatBanner.kt imports + message rendering ===" >> $OUT
          sed -n '1,28p;120,142p;205,260p' $SRC/ChatBanner.kt >> $OUT
          echo "" >> $OUT
          echo "=== SkillType enum + skillLevel ===" >> $OUT
          grep -rn "enum class SkillType" -A 24 $SRC --include=*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          grep -n "fun skillLevel" -B 1 -A 12 $SRC/GameViewModel.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== capes / level-99 detection ===" >> $OUT
          grep -rn -i "cape" $SRC --include=*.kt | head -40 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== kill tracking ===" >> $OUT
          grep -rn -i "reportKillProgress\|killCount\|totalKills\|monsterKills" $SRC --include=*.kt | head -60 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== tickCombat kill branch ===" >> $OUT
          grep -n "reportKillProgress" -B 12 -A 10 $SRC/GameViewModel.kt | head -120 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== offline combat outcome use ===" >> $OUT
          grep -n "resolveOfflineCombat" -B 8 -A 25 $SRC/GameViewModel.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== Character classes ===" >> $OUT
          grep -n "class Character" -A 30 $SRC/AccountCharacterSystem.kt | head -150 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== GameStateRepository loadoutSettings save/load ===" >> $OUT
          grep -n "loadoutSettings" -B 4 -A 14 $SRC/GameStateRepository.kt | head -150 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== leaderboard categories + repo functions ===" >> $OUT
          grep -rn "enum class LeaderboardCategory" -A 30 $SRC --include=*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          grep -n "fun " $SRC/SupabaseLeaderboardRepository.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== spendGems / gemsBalance repo code ===" >> $OUT
          grep -n "fun spendGems\|fun gemsBalance\|fun creditGems" -B 1 -A 14 $SRC/SupabaseMarketRepository.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== spend_gems SQL ===" >> $OUT
          grep -n -i "spend_gems" -B 2 -A 35 ./*.sql | head -120 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== RLS policy style + ownership helpers ===" >> $OUT
          grep -n -i "create policy" ./*.sql | head -20 >> $OUT || echo "NOT FOUND" >> $OUT
          grep -n -i "function.*character_owned_by_caller" -A 12 ./*.sql | head -40 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== SettingsScreen head ===" >> $OUT
          sed -n '1,110p' $SRC/SettingsScreen.kt >> $OUT
          echo "" >> $OUT
          echo "=== SettingsScreen call site ===" >> $OUT
          grep -n "SettingsScreen(" -B 6 -A 32 $SRC/MainActivity.kt >> $OUT || echo "NOT FOUND" >> $OUT
    artifacts:
      - discovery_output304.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_L_elemental_weakness.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
