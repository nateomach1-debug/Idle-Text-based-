workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output196.txt
          echo "=== Mute/Ban Kotlin call sites (GameViewModel) ===" > $OUT
          grep -n "muteCharacter\|banCharacter\|unmuteCharacter\|unbanCharacter" -B 2 -A 8 ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== ManualMuteSection full context in ModerationScreen ===" >> $OUT
          grep -n "ManualMuteSection\|ManualBanSection\|ManualGrantGemsSection" -B 3 -A 40 ./app/src/main/kotlin/com/yourname/idlerpg/ModerationScreen.kt >> $OUT
          echo "" >> $OUT
          echo "=== rpc( calls across kotlin files ===" >> $OUT
          grep -rn "\.rpc(" ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT
          echo "" >> $OUT
          echo "=== Mute/Ban SQL RPC definitions ===" >> $OUT
          grep -n "mute\|ban" -B 2 -A 20 ./*.sql >> $OUT
          echo "" >> $OUT
          echo "=== Moderator/role check pattern in SQL ===" >> $OUT
          grep -n "is_moderator\|is_mod\|role\s*=\s*'mod" -B 2 -A 10 ./*.sql >> $OUT
          echo "" >> $OUT
          echo "=== Account/AccountService premiumCurrency + grantTestGems ===" >> $OUT
          grep -n "premiumCurrency\|grantTestGems\|purchasePreset\|class Account\b\|class AccountService" -B 2 -A 15 ./app/src/main/kotlin/com/yourname/idlerpg/*.kt >> $OUT
          echo "" >> $OUT
          echo "=== characters table schema ===" >> $OUT
          grep -n "create table.*characters\|characters (" -A 20 ./*.sql >> $OUT
    artifacts:
      - discovery_output196.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_all_skill_backgrounds.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
