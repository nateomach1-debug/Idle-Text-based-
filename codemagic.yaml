workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output65.txt
          echo "=== the main tick loop (init block with delay(1000L)) ===" > $OUT
          grep -n "delay(1000L)" -B 5 -A 15 ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT || true
          echo "" >> $OUT
          echo "=== tickSkilling() full body ===" >> $OUT
          grep -n "fun tickSkilling" -A 40 ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT || true
          echo "" >> $OUT
          echo "=== tickCombat() full body ===" >> $OUT
          grep -n "fun tickCombat" -A 40 ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT || true
          echo "" >> $OUT
          echo "=== tickCrafting() full body ===" >> $OUT
          grep -n "fun tickCrafting" -A 40 ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT || true
          echo "" >> $OUT
          echo "=== search for any use of System.currentTimeMillis/Instant.now for elapsed-time-based progress (vs fixed per-tick) ===" >> $OUT
          grep -n "currentTimeMillis\|Instant.now()" ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT || echo "NO MATCHES" >> $OUT
          echo "" >> $OUT
          echo "=== offline catch-up estimator entry point(s) for comparison ===" >> $OUT
          grep -n "fun resolveOfflineRewardsAndSync\|fun.*[Oo]ffline.*[Ee]stimat" -A 30 ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT || true
          echo "" >> $OUT
          echo "=== manifest: any foreground service / wake lock / battery optimization handling ===" >> $OUT
          grep -n "Service\|WAKE_LOCK\|foregroundServiceType" ./app/src/main/AndroidManifest.xml >> $OUT || echo "NO MATCHES" >> $OUT
    artifacts:
      - discovery_output65.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_bury_queue_and_prayer.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
