workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output24.txt
          echo "=== SkillType enum full definition ===" > $OUT
          grep -n -A 30 "enum class SkillType" ./app/src/main/kotlin/com/yourname/idlerpg/*.kt >> $OUT || echo "NO MATCHES" >> $OUT
          echo "" >> $OUT
          echo "=== rollLoot() full body ===" >> $OUT
          grep -n -B 3 -A 40 "private fun rollLoot" ./app/src/main/kotlin/com/yourname/idlerpg/CombatSystem.kt >> $OUT || echo "NO MATCHES" >> $OUT
          echo "" >> $OUT
          echo "=== Monster data class (confirm level field name) ===" >> $OUT
          grep -n -A 10 "data class Monster(" ./app/src/main/kotlin/com/yourname/idlerpg/CombatSystem.kt >> $OUT || echo "NO MATCHES" >> $OUT
          echo "" >> $OUT
          echo "=== existing 'bone' item(s) in the catalog ===" >> $OUT
          grep -n -B 2 -A 8 'id = "bone"' ./app/src/main/kotlin/com/yourname/idlerpg/GeneratedItemCatalog.kt >> $OUT || echo "NO MATCHES" >> $OUT
          echo "" >> $OUT
          echo "=== any existing PRAYER / bury / bone references repo-wide ===" >> $OUT
          grep -rni "PRAYER\|bury\|\"bone" --include="*.kt" . >> $OUT || echo "NO MATCHES" >> $OUT
    artifacts:
      - discovery_output24.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_add_total_skill_level.py
          python3 patch_add_pies_and_fruits.py
          python3 patch_collapsed_chat_newest_first.py
          python3 patch_expanded_chat_newest_first.py
          python3 patch_require_seed_for_farming.py
          python3 patch_rename_farming_actions.py
          python3 patch_farming_missing_seed_ui.py
          python3 patch_fix_session_crash_on_restore.py
          python3 patch_prefetch_guild_and_chat.py
          python3 patch_stop_and_notify_on_exhausted_materials.py
          python3 patch_fix_service_result_field_name.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
