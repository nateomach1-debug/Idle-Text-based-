workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output159.txt

          echo "=== 1a. MarketScreen(...) call site(s) - host wiring, excludes the fun definition ===" > $OUT
          grep -rn "MarketScreen(" ./app/src/main/kotlin/com/yourname/idlerpg/ | grep -v "fun MarketScreen(" >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== 1b. showingBuyOrders / onToggleBrowseMode state, wherever it lives ===" >> $OUT
          grep -rn "showingBuyOrders\|onToggleBrowseMode\|toggleBrowseMode\|ToggleBrowseMode" ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== 2. SupabaseMarketRepository.kt - myOrders/placeBuyOrder/placeSellOrder bodies ===" >> $OUT
          grep -n "fun myOrders\|fun placeBuyOrder\|fun placeSellOrder" -A 25 ./app/src/main/kotlin/com/yourname/idlerpg/SupabaseMarketRepository.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== 2b. All .rpc(...) calls in SupabaseMarketRepository.kt (to identify real RPC names) ===" >> $OUT
          grep -n "\.rpc(" -A 2 ./app/src/main/kotlin/com/yourname/idlerpg/SupabaseMarketRepository.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== 3. All Supabase SQL function names defined at repo root ===" >> $OUT
          grep -n "CREATE OR REPLACE FUNCTION\|CREATE FUNCTION" ./*.sql >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== 3b. Full body of any order-related SQL function (case-insensitive match on 'order') ===" >> $OUT
          grep -n -i -A 40 "CREATE OR REPLACE FUNCTION.*order\|CREATE FUNCTION.*order" ./*.sql >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== 4a. Full ItemCatalog.kt (every item in game, for buy-order dropdown) ===" >> $OUT
          grep -n "" ./app/src/main/kotlin/com/yourname/idlerpg/ItemCatalog.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== 4b. Inventory item enumeration (vendorSellableItems / InventoryItemSummary source, for sell-order dropdown) ===" >> $OUT
          grep -rn "InventoryItemSummary\|vendorSellableItems\|fun inventoryFor\|fun allItems" -A 8 ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NOT FOUND" >> $OUT
    artifacts:
      - discovery_output159.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_all_skill_backgrounds.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
