workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output109.txt
          echo "=== Sealed class / enum screen or tab definitions ===" > $OUT
          grep -rn "sealed class.*Screen\|sealed interface.*Screen\|enum class.*Screen\|enum class.*Tab" ./app/src/main/kotlin/com/yourname/idlerpg/*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== AppFlowState or currentScreen/selectedTab state holders ===" >> $OUT
          grep -rn "AppFlowState\|currentScreen\|selectedTab\|_currentScreen\|_selectedTab" ./app/src/main/kotlin/com/yourname/idlerpg/*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== NavigationRail / IconRail / BottomNavigation composable usage ===" >> $OUT
          grep -rln "NavigationRail\|IconRail\|BottomNavigation" ./app/src/main/kotlin/com/yourname/idlerpg/*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== MainActivity.kt full dump (most likely home of top-level screen switching) ===" >> $OUT
          cat ./app/src/main/kotlin/com/yourname/idlerpg/MainActivity.kt >> $OUT || echo "MainActivity.kt NOT FOUND at expected path" >> $OUT
          echo "" >> $OUT
          echo "=== Guild tab wiring, since we know Guild already has an icon-rail entry (reference pattern) ===" >> $OUT
          grep -n "Guild" ./app/src/main/kotlin/com/yourname/idlerpg/MainActivity.kt >> $OUT || echo "NOT FOUND" >> $OUT
    artifacts:
      - discovery_output109.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_bury_queue_and_prayer.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
