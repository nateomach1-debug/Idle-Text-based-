workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output50.txt
          echo "=== setTrainingSkill() full body ===" > $OUT
          grep -n -B 3 -A 15 "fun setTrainingSkill" ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== GameStateRepository.kt current save() signature ===" >> $OUT
          grep -n -A 20 "fun save(" ./app/src/main/kotlin/com/yourname/idlerpg/GameStateRepository.kt >> $OUT
          echo "" >> $OUT
          echo "=== GameStateRepository.kt current save() body tail (before writeText) ===" >> $OUT
          grep -n -B 5 "saveFile.writeText" ./app/src/main/kotlin/com/yourname/idlerpg/GameStateRepository.kt >> $OUT
          echo "" >> $OUT
          echo "=== GameStateRepository.kt current load() body around inventoryItems parsing ===" >> $OUT
          grep -n -B 20 "val inventoryItems = mutableListOf" ./app/src/main/kotlin/com/yourname/idlerpg/GameStateRepository.kt >> $OUT
          echo "" >> $OUT
          echo "=== GameStateRepository.kt current return SavedGameState + SavedGameState class ===" >> $OUT
          grep -n -B 3 -A 5 "return SavedGameState(" ./app/src/main/kotlin/com/yourname/idlerpg/GameStateRepository.kt >> $OUT
          grep -n -B 1 -A 18 "data class SavedGameState" ./app/src/main/kotlin/com/yourname/idlerpg/GameStateRepository.kt >> $OUT
          echo "" >> $OUT
          echo "=== GameViewModel.kt saveGame() current full body ===" >> $OUT
          grep -n -B 2 -A 20 "fun saveGame" ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== all three loadoutSettings.forEach restore lines with surrounding context ===" >> $OUT
          grep -n -B 3 -A 1 "loadoutSettings.forEach" ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
    artifacts:
      - discovery_output50.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_bury_queue_and_prayer.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
