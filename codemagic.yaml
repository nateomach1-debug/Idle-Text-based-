workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output66.txt
          echo "=== tickBurying() full body ===" > $OUT
          grep -n "fun tickBurying" -A 40 ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT || true
          echo "" >> $OUT
          echo "=== tickConsumables() full body ===" >> $OUT
          grep -n "fun tickConsumables" -A 40 ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT || true
          echo "" >> $OUT
          echo "=== all progress-second accumulator fields (skillActionProgressSeconds etc) declarations ===" >> $OUT
          grep -n "ProgressSeconds\s*:\?\s*=\|ProgressSeconds =\|var.*ProgressSeconds" ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT || true
          echo "" >> $OUT
          echo "=== combatService tick-driven timing (attack speed / cooldown) - is it also flat-per-tick? ===" >> $OUT
          sed -n '608,660p' ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT || true
          echo "" >> $OUT
          echo "=== offlineIdleService.resolveOfflineProgress() - confirm it truly uses real elapsed time, for reference ===" >> $OUT
          grep -n "fun resolveOfflineProgress" -A 30 ./app/src/main/kotlin/com/yourname/idlerpg/OfflineIdleService.kt >> $OUT || true
    artifacts:
      - discovery_output66.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_bury_queue_and_prayer.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
