workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output9.txt
          echo "=== price map declaration + meat_pie/cooked_beef price entries + closing brace ===" > $OUT
          grep -n "val.*[Pp]rice.*=.*map\|mapOf(" ./app/src/main/kotlin/com/yourname/idlerpg/GeneratedItemCatalog.kt | head -5 >> $OUT
          echo "" >> $OUT
          grep -n '"meat_pie" to\|"cooked_beef" to\|"pie_shell" to' ./app/src/main/kotlin/com/yourname/idlerpg/GeneratedItemCatalog.kt >> $OUT || echo "NONE OF THESE HAVE PRICE ENTRIES" >> $OUT
          echo "" >> $OUT
          echo "=== last 20 lines of the price map (context around its close) ===" >> $OUT
          grep -n "^)" ./app/src/main/kotlin/com/yourname/idlerpg/GeneratedItemCatalog.kt | head -20 >> $OUT
    artifacts:
      - discovery_output9.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch script
        script: python3 patch_fix_character_sync_race.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt
          git commit -m "Fix character sync race condition on cold start"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
