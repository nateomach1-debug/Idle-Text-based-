workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output61.txt
          echo "=== full selectCharacter() body, GameViewModel.kt lines 1115-1260 ===" > $OUT
          sed -n '1115,1260p' ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== is restoreTrainingSkillFor called a second time anywhere after the remoteLocalId swap? ===" >> $OUT
          grep -n "restoreTrainingSkillFor" ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== get_or_create_character RPC definition (SQL) ===" >> $OUT
          grep -rn -A 40 "get_or_create_character" --include=*.sql . >> $OUT
          echo "" >> $OUT
          echo "=== get_character_local_id RPC definition (SQL) ===" >> $OUT
          grep -rn -A 40 "get_character_local_id" --include=*.sql . >> $OUT
          echo "" >> $OUT
          echo "=== how/where currentCharacterId and currentSupabaseCharacterId get persisted/restored across cold start ===" >> $OUT
          grep -rn "_currentCharacterId\|_currentSupabaseCharacterId" ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== tryAutoLogin definition ===" >> $OUT
          grep -n "fun tryAutoLogin" -A 60 ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== sessionManager: what character/account id gets saved and restored on disk ===" >> $OUT
          grep -rn "class SessionManager" -A 60 ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT
    artifacts:
      - discovery_output61.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_bury_queue_and_prayer.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
