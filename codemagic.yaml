workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output146.txt
          echo "=== SkillListRow full body ===" > $OUT
          sed -n '193,225p' ./app/src/main/kotlin/com/yourname/idlerpg/SkillsScreen.kt >> $OUT
          echo "" >> $OUT
          echo "=== SkillGridTile full body ===" >> $OUT
          sed -n '225,251p' ./app/src/main/kotlin/com/yourname/idlerpg/SkillsScreen.kt >> $OUT
          echo "" >> $OUT
          echo "=== Imports (top of file) ===" >> $OUT
          sed -n '1,35p' ./app/src/main/kotlin/com/yourname/idlerpg/SkillsScreen.kt >> $OUT
    artifacts:
      - discovery_output146.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_all_skill_backgrounds.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
