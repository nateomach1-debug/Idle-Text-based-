workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output7.txt
          echo "=== object ItemCatalog (wherever it actually lives) ===" > $OUT
          grep -rn -A 15 "object ItemCatalog" --include="*.kt" . >> $OUT || echo "NO MATCHES" >> $OUT
          echo "" >> $OUT
          echo "=== SkillActionOption data class + full FARMING entries ===" >> $OUT
          grep -rn -B 3 -A 8 "data class SkillActionOption" --include="*.kt" . >> $OUT || echo "NO MATCHES" >> $OUT
          grep -rn -B 2 -A 2 "SkillActionOption(\"FARMING\"" --include="*.kt" . >> $OUT || echo "NO FARMING ACTIONS FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== all existing COOKING recipes (template for pies) ===" >> $OUT
          grep -rn -B 2 -A 8 "skillRequired = \"COOKING\"" --include="*.kt" . >> $OUT || echo "NO COOKING RECIPES FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== apple/lemon/pumpkin/pie mentions repo-wide ===" >> $OUT
          grep -rni "apple\|lemon\|pumpkin\|\bpie\b" --include="*.kt" . >> $OUT || echo "NO MATCHES" >> $OUT
          echo "" >> $OUT
          echo "=== SkillsScreen.kt full file ===" >> $OUT
          find . -iname "SkillsScreen.kt" -exec cat {} \; >> $OUT
    artifacts:
      - discovery_output7.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch script
        script: python3 patch_fix_character_sync_race.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt
          git commit -m "Fix character sync race condition on cold start"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
