workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output305.txt
          SRC=./app/src/main/kotlin/com/yourname/idlerpg
          echo "=== resolveAttack ===" > $OUT
          grep -n "fun resolveAttack" -B 2 -A 80 $SRC/CombatSystem.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== rollLoot ===" >> $OUT
          grep -n "fun rollLoot" -A 32 $SRC/CombatSystem.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== tickCombat ===" >> $OUT
          grep -n "fun tickCombat" -A 190 $SRC/GameViewModel.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== monsterDefeated usages ===" >> $OUT
          grep -rn "monsterDefeated" $SRC --include=*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== login / session load hooks ===" >> $OUT
          sed -n '1736,1780p' $SRC/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== refreshCurrency + supabase character id ===" >> $OUT
          grep -n "fun refreshCurrency" -B 2 -A 25 $SRC/GameViewModel.kt >> $OUT || echo "NOT FOUND" >> $OUT
          grep -n "_currentSupabaseCharacterId" $SRC/GameViewModel.kt | head -12 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== sql files + leaderboard SQL ===" >> $OUT
          ls ./*.sql >> $OUT
          grep -n -i "leaderboard" ./*.sql | head -40 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== skill stat sync (client to server) ===" >> $OUT
          grep -rn -i "leaderboard\|skill_stats\|character_skills\|upsertSkill\|syncSkill\|pushSkill\|updateSkillLevel" $SRC --include=*.kt | head -60 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== SupabaseLeaderboardRepository (full) ===" >> $OUT
          cat $SRC/SupabaseLeaderboardRepository.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== main tick loop ===" >> $OUT
          grep -n "delay(1000L)" -B 8 -A 14 $SRC/GameViewModel.kt >> $OUT || echo "NOT FOUND" >> $OUT
    artifacts:
      - discovery_output305.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_L_elemental_weakness.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
