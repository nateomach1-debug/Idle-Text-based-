workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output70.txt
          echo "=== find Skills screen composable file(s) ===" > $OUT
          grep -rln "SkillsScreen\|fun.*Skill.*Screen" ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== find where skill level progress bars are rendered (LinearProgressIndicator near skill) ===" >> $OUT
          grep -rln "LinearProgressIndicator" ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== ProgressionService / xp-per-level formula and skill data model ===" >> $OUT
          grep -rn "fun grantXp\|fun xpForLevel\|fun levelFor\|class SkillProgress\|currentXp\|xpIntoLevel\|xpForNextLevel" ./app/src/main/kotlin/com/yourname/idlerpg/ProgressionService.kt >> $OUT || echo "NOT FOUND - check filename" >> $OUT
          echo "" >> $OUT
          echo "=== find files referencing ProgressionService, in case filename differs ===" >> $OUT
          grep -rln "class ProgressionService\|ProgressionService(" ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NOT FOUND" >> $OUT
    artifacts:
      - discovery_output70.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_bury_queue_and_prayer.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
