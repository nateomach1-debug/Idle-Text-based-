workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output49.txt
          echo "=== _trainingSkill declaration and default value ===" > $OUT
          grep -n "_trainingSkill" ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== confirm no BuryQueueExport/exportBuryQueues/restoreBuryQueue exist anywhere ===" >> $OUT
          grep -rn "BuryQueueExport\|exportBuryQueues\|restoreBuryQueue" --include="*.kt" . >> $OUT || echo "CONFIRMED: NONE EXIST" >> $OUT
          echo "" >> $OUT
          echo "=== how skillingQueues export/import threads characterId+itemId+secondsPerAction (template) ===" >> $OUT
          grep -n -B 2 -A 8 "data class SkillingQueueExport" ./app/src/main/kotlin/com/yourname/idlerpg/OfflineIdleMechanicsSystem.kt >> $OUT
          grep -n -B 2 -A 8 "fun exportSkillingQueues\|fun restoreSkillingQueue" ./app/src/main/kotlin/com/yourname/idlerpg/OfflineIdleMechanicsSystem.kt >> $OUT
    artifacts:
      - discovery_output49.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_bury_queue_and_prayer.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
