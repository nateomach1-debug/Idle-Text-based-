workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output163.txt

          echo "=== A. List all background image files (drawable dirs) ===" > $OUT
          find ./app/src/main/res -iname "*bg*" -o -iname "*background*" >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== B. Mining/Woodcutting background filenames specifically (already shipped, for naming convention) ===" >> $OUT
          find ./app/src/main/res -iname "*mining*" -o -iname "*woodcutting*" >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== C. Fishing/Farming background filenames if they already exist as placeholders ===" >> $OUT
          find ./app/src/main/res -iname "*fishing*" -o -iname "*farming*" >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== D. Kotlin mapping of skill -> background drawable resource ===" >> $OUT
          grep -rn -i "skillbackground\|R.drawable.bg_\|backgroundFor" ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== E. Image dimensions/format of one known-good background (mining) if found ===" >> $OUT
          MINING_FILE=$(find ./app/src/main/res -iname "*mining*" | head -1)
          if [ -n "$MINING_FILE" ]; then
            echo "File: $MINING_FILE" >> $OUT
            file "$MINING_FILE" >> $OUT
            ls -la "$MINING_FILE" >> $OUT
          else
            echo "NOT FOUND" >> $OUT
          fi
    artifacts:
      - discovery_output163.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_all_skill_backgrounds.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
