workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output11.txt
          echo "=== _chatMessages / chatMessages StateFlow declaration and every place it's set ===" > $OUT
          grep -n "_chatMessages\|chatMessages" ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== loadInitialChatState() and selectChatChannel() full bodies ===" >> $OUT
          grep -n -A 40 "fun loadInitialChatState\|fun selectChatChannel" ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== chat message fetch/order in the Supabase chat repository ===" >> $OUT
          grep -n -B 3 -A 15 "order(\|\.sortedBy\|\.sortedByDescending" ./app/src/main/kotlin/com/yourname/idlerpg/SupabaseChatRepository.kt >> $OUT || echo "NO MATCHES" >> $OUT
    artifacts:
      - discovery_output11.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_add_total_skill_level.py
          python3 patch_add_pies_and_fruits.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt
          git commit -m "Fix character sync race condition on cold start"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
