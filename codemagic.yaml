workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output197.txt
          echo "=== All .sql files in repo (recursive) ===" > $OUT
          find . -name "*.sql" >> $OUT
          echo "" >> $OUT
          echo "=== admin_mute_character / admin_unmute_character full definitions ===" >> $OUT
          grep -rn "CREATE OR REPLACE FUNCTION public.admin_mute_character\|CREATE OR REPLACE FUNCTION public.admin_unmute_character" -A 40 . --include=*.sql >> $OUT || true
          echo "" >> $OUT
          echo "=== market_currency_balance + combat_grant_coins full definitions ===" >> $OUT
          grep -rn "CREATE OR REPLACE FUNCTION public.market_currency_balance\|CREATE OR REPLACE FUNCTION public.combat_grant_coins" -A 40 . --include=*.sql >> $OUT || true
          echo "" >> $OUT
          echo "=== is_moderator / moderator check helper function ===" >> $OUT
          grep -rn "is_moderator" -B 3 -A 15 . --include=*.sql >> $OUT || true
          echo "" >> $OUT
          echo "=== gold/currency table schema (wherever it lives) ===" >> $OUT
          grep -rln "gold\|currency" . --include=*.sql >> $OUT || true
          echo "" >> $OUT
          echo "=== character_owned_by_caller helper (used by send_chat_message) ===" >> $OUT
          grep -rn "CREATE OR REPLACE FUNCTION public.character_owned_by_caller" -A 15 . --include=*.sql >> $OUT || true
    artifacts:
      - discovery_output197.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_all_skill_backgrounds.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
