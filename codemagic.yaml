workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output16.txt
          echo "=== missingIngredientsFor function definition ===" > $OUT
          grep -rn -B 3 -A 20 "fun missingIngredientsFor" --include="*.kt" . >> $OUT || echo "NO MATCHES" >> $OUT
          echo "" >> $OUT
          echo "=== where startSkillAction is called from UI (leads to the gathering screen) ===" >> $OUT
          grep -rn -B 20 "startSkillAction(" --include="*.kt" . | grep -v "GameViewModel.kt" >> $OUT || echo "NO MATCHES" >> $OUT
          echo "" >> $OUT
          echo "=== SmithingMaterialCatalogEntry / missingIngredients rendering in UI (grayed out + popup) ===" >> $OUT
          grep -rn -B 5 -A 30 "missingIngredients" --include="*.kt" . | grep -v "GameViewModel.kt\|ItemsEquipmentSystem.kt" >> $OUT || echo "NO MATCHES" >> $OUT
    artifacts:
      - discovery_output16.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_add_total_skill_level.py
          python3 patch_add_pies_and_fruits.py
          python3 patch_collapsed_chat_newest_first.py
          python3 patch_expanded_chat_newest_first.py
          python3 patch_require_seed_for_farming.py
          python3 patch_rename_farming_actions.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
