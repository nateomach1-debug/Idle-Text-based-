workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output164.txt

          echo "=== A. Any existing BackHandler usage (avoid conflicts) ===" > $OUT
          grep -rn "BackHandler" ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== B. Top-level screen state (enum/sealed class + how it's switched) ===" >> $OUT
          grep -n "enum class Screen\|sealed class Screen\|var currentScreen\|currentDestination" ./app/src/main/kotlin/com/yourname/idlerpg/MainActivity.kt ./app/src/main/kotlin/com/yourname/idlerpg/NavigationDestinations.kt ./app/src/main/kotlin/com/yourname/idlerpg/SideRail.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== C. Full NavigationDestinations.kt (top-level screen definitions) ===" >> $OUT
          grep -n "" ./app/src/main/kotlin/com/yourname/idlerpg/NavigationDestinations.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== D. Guild sub-tab state (enum + remembered var), similar to MarketTab ===" >> $OUT
          grep -rn "enum class GuildTab\|var guildTab\|GuildTab\." ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== E. Any other 'enum class .*Tab' across the whole app (find every sub-tab screen) ===" >> $OUT
          grep -rn "enum class.*Tab" ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== F. Existing import block of MainActivity.kt (check for androidx.activity.compose.BackHandler) ===" >> $OUT
          sed -n '1,40p' ./app/src/main/kotlin/com/yourname/idlerpg/MainActivity.kt >> $OUT
    artifacts:
      - discovery_output164.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_all_skill_backgrounds.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
