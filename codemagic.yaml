workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output152.txt
          echo "=== Full Battlestaff ItemDefinition ===" > $OUT
          sed -n '2436,2450p' ./app/src/main/kotlin/com/yourname/idlerpg/GeneratedItemCatalog.kt >> $OUT
          echo "" >> $OUT
          echo "=== Full Copper Ore ItemDefinition ===" >> $OUT
          sed -n '15,22p' ./app/src/main/kotlin/com/yourname/idlerpg/GeneratedItemCatalog.kt >> $OUT
          echo "" >> $OUT
          echo "=== ItemStats data class full definition ===" >> $OUT
          grep -n "data class ItemStats" -A 10 ./app/src/main/kotlin/com/yourname/idlerpg/SharedTypes.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== LootEntry data class ===" >> $OUT
          grep -n "data class LootEntry" -A 8 ./app/src/main/kotlin/com/yourname/idlerpg/CombatSystem.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== rollLoot bone-grant section, full context, for the pattern to copy ===" >> $OUT
          sed -n '427,460p' ./app/src/main/kotlin/com/yourname/idlerpg/CombatSystem.kt >> $OUT
    artifacts:
      - discovery_output152.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_all_skill_backgrounds.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
