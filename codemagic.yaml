workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output82.txt
          echo "=== SupabaseGuildRepository.kt lines 178-330 (createGuild/joinGuild/kickMember/promote functions) ===" > $OUT
          sed -n '178,330p' ./app/src/main/kotlin/com/yourname/idlerpg/SupabaseGuildRepository.kt >> $OUT
          echo "" >> $OUT
          echo "=== GameViewModel.kt guild state field declarations (_guildId, _guildHomeState, _browsableGuilds, _guildActionError, _guildLeaderboard) ===" >> $OUT
          grep -n "_guildId\s*=\|_guildHomeState\s*=\|_browsableGuilds\s*=\|_guildActionError\s*=\|_guildLeaderboard\s*=\|val guildId\|val guildHomeState\|val browsableGuilds\|val guildActionError\|val guildLeaderboard" ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== refreshGuildHome() full body ===" >> $OUT
          grep -n "fun refreshGuildHome" -A 15 ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== ItemDefinition class full definition, for reference on fields available (rarity etc) ===" >> $OUT
          grep -n "data class ItemDefinition" -A 20 ./app/src/main/kotlin/com/yourname/idlerpg/SharedTypes.kt >> $OUT
          echo "" >> $OUT
          echo "=== inventoryService.inventoryFor and how items are removed from inventory (for consuming contributed items) ===" >> $OUT
          grep -n "fun removeItem\|fun consumeItem\|fun addItem" -A 12 ./app/src/main/kotlin/com/yourname/idlerpg/ItemsEquipmentSystem.kt >> $OUT
    artifacts:
      - discovery_output82.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_bury_queue_and_prayer.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
