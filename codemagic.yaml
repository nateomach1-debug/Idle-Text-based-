workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          echo "=== Mute/Ban Kotlin call sites ===" >> "$OUT"
grep -n "muteCharacter\|banCharacter\|unmuteCharacter\|unbanCharacter" -A 5 ./app/src/main/kotlin/com/yourname/idlerpg/*.kt >> "$OUT" 2>/dev/null || echo "NOT FOUND" >> "$OUT"

echo "=== ModerationScreen.kt full content ===" >> "$OUT"
cat ./app/src/main/kotlin/com/yourname/idlerpg/ModerationScreen.kt >> "$OUT" 2>/dev/null || echo "NOT FOUND" >> "$OUT"

echo "=== Mute/Ban SQL RPCs ===" >> "$OUT"
grep -n "mute\|ban" -A 20 ./*.sql >> "$OUT" 2>/dev/null || echo "NOT FOUND" >> "$OUT"

echo "=== Moderator/role check pattern in SQL ===" >> "$OUT"
grep -n "is_moderator\|is_mod\|role\s*=\s*'mod" -A 10 ./*.sql >> "$OUT" 2>/dev/null || echo "NOT FOUND" >> "$OUT"

echo "=== Account.kt / AccountService.kt premiumCurrency + grantTestGems ===" >> "$OUT"
grep -n "premiumCurrency\|grantTestGems\|purchasePreset\|class Account\b\|class AccountService" -A 15 ./app/src/main/kotlin/com/yourname/idlerpg/*.kt >> "$OUT" 2>/dev/null || echo "NOT FOUND" >> "$OUT"

echo "=== characters table schema ===" >> "$OUT"
grep -n "create table.*characters\|characters\s*(" -A 20 ./*.sql >> "$OUT" 2>/dev/null || echo "NOT FOUND" >> "$OUT"

echo "=== GameViewModel.kt grantTestGems + moderation RPC calls ===" >> "$OUT"
grep -n "grantTestGems\|supabaseClient.postgrest.rpc\|\.rpc(" -B 2 -A 8 ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> "$OUT" 2>/dev/null || echo "NOT FOUND" >> "$OUT"
    artifacts:
      - discovery_output1.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_all_skill_backgrounds.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
