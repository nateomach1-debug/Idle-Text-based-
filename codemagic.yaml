workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output192.txt
          echo "=== GameViewModel.kt lines 1295-1330 (the loop containing tickConsumables/tickCombat calls) ===" > $OUT
          sed -n '1295,1330p' ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== Function name enclosing that loop (search backward for 'private fun' before line 1310) ===" >> $OUT
          awk 'NR<=1310 && /private fun|fun /{line=NR": "$0} END{print line}' ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== All other while(true) loops or periodic coroutines in GameViewModel.kt ===" >> $OUT
          grep -n "while (true)\|fixedRateTimer\|delay(1000\|delay(1_000" ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
    artifacts:
      - discovery_output192.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_all_skill_backgrounds.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
