workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output117.txt
          echo "=== VendorBuyCatalog + VendorBuyableItem full definition ===" > $OUT
          grep -n "object VendorBuyCatalog" -A 40 ./app/src/main/kotlin/com/yourname/idlerpg/MarketScreen.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          grep -n "data class VendorBuyableItem" -A 10 ./app/src/main/kotlin/com/yourname/idlerpg/*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== Where vendorBuyableItems is computed/filtered for the ViewModel/UI ===" >> $OUT
          grep -n "vendorBuyableItems\|fun vendorBuyableItemsFor" ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt ./app/src/main/kotlin/com/yourname/idlerpg/MainActivity.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== Rest of tickCombat: MELEE branch + damage/reduction resolution + resolveAttack ===" >> $OUT
          grep -n "fun tickCombat" -A 140 ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt | tail -n 90 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== CombatSystem.resolveAttack + Defense reduction formula ===" >> $OUT
          grep -n "fun resolveAttack\|defenseLevel\|0.005\|coerceAtMost(0.5" -A 15 ./app/src/main/kotlin/com/yourname/idlerpg/CombatSystem.kt ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== Prayer damage-reduction application site ===" >> $OUT
          grep -n "selectedPrayerId" ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT || echo "NOT FOUND" >> $OUT
    artifacts:
      - discovery_output117.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_bury_queue_and_prayer.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
