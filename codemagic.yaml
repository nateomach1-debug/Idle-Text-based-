workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output173.txt

          echo "=== A. Gradle files (build.gradle.kts locations, version catalog) ===" > $OUT
          find . -maxdepth 3 -iname "build.gradle*" -o -iname "libs.versions.toml" | grep -v node_modules >> $OUT
          echo "" >> $OUT
          echo "=== A2. app/build.gradle.kts full content ===" >> $OUT
          grep -n "" ./app/build.gradle.kts >> $OUT || echo "NOT FOUND (maybe .gradle not .gradle.kts)" >> $OUT
          echo "" >> $OUT

          echo "=== B. market_currency_balance RPC usage + currency balance StateFlow pattern (template to copy for gems) ===" >> $OUT
          grep -n "market_currency_balance\|refreshCurrency\|_currency\b\|currencyBalance" ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== C. Settings screen file(s) - RGB slider / overrideColor / glow toggle location ===" >> $OUT
          grep -rln "overrideColor\|IdleRpgTypography" ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== D. AppDestination enum + SideRail entries (to see where a Gem Shop entry point could go) ===" >> $OUT
          grep -n "enum class AppDestination" -A 15 ./app/src/main/kotlin/com/yourname/idlerpg/NavigationDestinations.kt >> $OUT || echo "NOT FOUND" >> $OUT
    artifacts:
      - discovery_output173.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_all_skill_backgrounds.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
