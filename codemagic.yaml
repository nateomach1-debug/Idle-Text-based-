workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output188.txt

          echo "=== A. Moderation screen file + existing mute/ban action pattern (for grant-gems UI) ===" > $OUT
          grep -rln "fun ModerationScreen\|fun muteAccount\|banAccount(" ./app/src/main/kotlin/com/yourname/idlerpg/*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== A2. Full ModerationScreen.kt ===" >> $OUT
          grep -n "" ./app/src/main/kotlin/com/yourname/idlerpg/ModerationScreen.kt >> $OUT || echo "NOT FOUND at that path" >> $OUT
          echo "" >> $OUT

          echo "=== B. Auto-heal/auto-eat logic in combat tick ===" >> $OUT
          grep -n "autoHealThresholdPercent\|fun tickCombat\|selectedFoodId\|healAmount" ./app/src/main/kotlin/com/yourname/idlerpg/*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT

          echo "=== C. LoadoutScreen.kt food picker (for unequip option) ===" >> $OUT
          grep -n "" ./app/src/main/kotlin/com/yourname/idlerpg/LoadoutScreen.kt >> $OUT || echo "NOT FOUND at that path" >> $OUT
    artifacts:
      - discovery_output188.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_all_skill_backgrounds.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
