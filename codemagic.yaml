workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output302.txt
          SRC=./app/src/main/kotlin/com/yourname/idlerpg
          echo "=== GameViewModel class header ===" > $OUT
          grep -n "^class GameViewModel" -A 70 $SRC/GameViewModel.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== combatService references ===" >> $OUT
          grep -n "combatService\b" $SRC/GameViewModel.kt | head -40 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== settingsPrefs / SharedPreferences ===" >> $OUT
          grep -n "settingsPrefs\|getSharedPreferences\|SharedPreferences" $SRC/GameViewModel.kt | head -30 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== init blocks ===" >> $OUT
          grep -n "^    init {" -A 12 $SRC/GameViewModel.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== resolveOfflineCombat call sites ===" >> $OUT
          grep -rn "resolveOfflineCombat" $SRC --include=*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== leaveCombatZone ===" >> $OUT
          grep -n "fun leaveCombatZone" -A 20 $SRC/GameViewModel.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== other enterCombatZone callers ===" >> $OUT
          grep -rn "enterCombatZone" $SRC --include=*.kt >> $OUT || echo "NOT FOUND" >> $OUT
    artifacts:
      - discovery_output302.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_L_elemental_weakness.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
