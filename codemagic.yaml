workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output151.txt
          echo "=== Battlestaff full ItemDefinition ===" > $OUT
          grep -n "id = \"battlestaff\"" -B 2 -A 8 ./app/src/main/kotlin/com/yourname/idlerpg/*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== ItemCategory enum options ===" >> $OUT
          grep -n "enum class ItemCategory" -A 12 ./app/src/main/kotlin/com/yourname/idlerpg/SharedTypes.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== Example existing MATERIAL-category item for shape reference ===" >> $OUT
          grep -n "ItemCategory.MATERIAL" -B 3 ./app/src/main/kotlin/com/yourname/idlerpg/*.kt | head -20 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== Zone list (for deciding which zones drop the new essences) ===" >> $OUT
          grep -n "Zone(" -A 3 ./app/src/main/kotlin/com/yourname/idlerpg/CombatSystem.kt | grep "id =\|name =" >> $OUT || echo "NOT FOUND" >> $OUT
    artifacts:
      - discovery_output151.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_all_skill_backgrounds.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
