workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output55.txt
          echo "=== every assignment to _trainingSkill.value, repo-wide ===" > $OUT
          grep -rn "_trainingSkill.value =" --include="*.kt" . >> $OUT || echo "NO MATCHES" >> $OUT
          echo "" >> $OUT
          echo "=== setTrainingSkill() full current body ===" >> $OUT
          grep -n -B 2 -A 15 "fun setTrainingSkill" ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== full current selectCharacter() body, unabridged ===" >> $OUT
          awk '/fun selectCharacter\(characterId: String\)/,0' ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt | awk 'BEGIN{d=0} {print} /^    }/{d++; if(d==1) exit}' >> $OUT
    artifacts:
      - discovery_output55.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_bury_queue_and_prayer.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
