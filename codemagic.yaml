workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output301.txt
          SRC=./app/src/main/kotlin/com/yourname/idlerpg
          echo "=== Zone headers ===" > $OUT
          grep -n "^ *Zone($" -A 5 $SRC/CombatSystem.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== CombatSystem.kt 160-200 (Gem Hoarder tail) ===" >> $OUT
          sed -n '160,200p' $SRC/CombatSystem.kt >> $OUT
          echo "" >> $OUT
          echo "=== CombatSystem.kt 225-312 (loadout/session/state classes) ===" >> $OUT
          sed -n '225,312p' $SRC/CombatSystem.kt >> $OUT
          echo "" >> $OUT
          echo "=== CombatSystem.kt 343-370 (pause/resume/find monster) ===" >> $OUT
          sed -n '343,370p' $SRC/CombatSystem.kt >> $OUT
          echo "" >> $OUT
          echo "=== CombatSystem.kt 540-615 (offline estimate) ===" >> $OUT
          sed -n '540,615p' $SRC/CombatSystem.kt >> $OUT
          echo "" >> $OUT
          echo "=== offline combat queue: usages ===" >> $OUT
          grep -rn "optIntoOfflineCombat\|OfflineCombatQueue\|class .*OfflineCombat\|enterZone(\|\.startSearching(\|restoreCombat\|restoreSession" $SRC --include=*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== optIntoOfflineCombat def ===" >> $OUT
          grep -rn "fun optIntoOfflineCombat" -B 2 -A 25 $SRC --include=*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== OfflineCombat data classes ===" >> $OUT
          grep -rn "class .*OfflineCombat" -A 15 $SRC --include=*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== refreshCombatView ===" >> $OUT
          grep -n "fun refreshCombatView" -A 45 $SRC/GameViewModel.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== CombatViewData class ===" >> $OUT
          grep -rn "class CombatViewData" -A 20 $SRC --include=*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== GameViewModel imports ===" >> $OUT
          grep -n "^import" $SRC/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== ZoneSummary usages ===" >> $OUT
          grep -rn "ZoneSummary\|zoneSummaries" $SRC --include=*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== MainActivity zones/imports ===" >> $OUT
          grep -n "^import.*idlerpg\|val zones" $SRC/MainActivity.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== monster refs in other files ===" >> $OUT
          grep -n -i "monster" $SRC/QuestsContentSystem.kt $SRC/SkillsScreen.kt $SRC/ActionCatalog.kt | head -60 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== levelRequirement usage (combat) ===" >> $OUT
          grep -n "\.levelRequirement" $SRC/GameViewModel.kt $SRC/CombatSystem.kt | head -30 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== candidate loot item ids ===" >> $OUT
          grep -rhoE 'id = "[a-z0-9_]*(hide|bone|fang|scale|claw|egg|ear|ecto|essence|gem|feather|leather|tooth|horn|wing|venom|ash|ember|silk|dust|shard|dragon|meat|beef|chicken|fur|slime|dagger)[a-z0-9_]*"' $SRC --include=*.kt | sort -u | head -200 >> $OUT || echo "NOT FOUND" >> $OUT
    artifacts:
      - discovery_output301.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_L_elemental_weakness.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
