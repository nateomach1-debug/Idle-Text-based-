workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output77.txt
          echo "=== GuildRow definition ===" > $OUT
          grep -rn "data class GuildRow" -A 10 ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== GuildMemberRow definition ===" >> $OUT
          grep -rn "data class GuildMemberRow" -A 10 ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== GuildEventRow definition ===" >> $OUT
          grep -rn "data class GuildEventRow" -A 10 ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== GuildVoteRow / VoteBallotRow / CharacterNameRow definitions ===" >> $OUT
          grep -rn "data class GuildVoteRow\|data class VoteBallotRow\|data class CharacterNameRow" -A 8 ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== full GuildClanSystem.kt lines 195-381 (previously truncated, in case Row DTOs live here) ===" >> $OUT
          sed -n '195,381p' ./app/src/main/kotlin/com/yourname/idlerpg/GuildClanSystem.kt >> $OUT
          echo "" >> $OUT
          echo "=== any existing item catalog table reference server-side (search for 'items' table usage) ===" >> $OUT
          grep -rn "from(\"items\")\|item_catalog" ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NOT FOUND - item catalog likely client-only" >> $OUT
    artifacts:
      - discovery_output77.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_bury_queue_and_prayer.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
