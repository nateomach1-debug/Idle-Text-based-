workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output198.txt
          echo "=== SupabaseModerationRepository.kt FULL ===" > $OUT
          cat ./app/src/main/kotlin/com/yourname/idlerpg/SupabaseModerationRepository.kt >> $OUT
          echo "" >> $OUT
          echo "=== SupabaseMarketRepository.kt FULL ===" >> $OUT
          cat ./app/src/main/kotlin/com/yourname/idlerpg/SupabaseMarketRepository.kt >> $OUT
          echo "" >> $OUT
          echo "=== GameViewModel.kt: currency/gem related (grantTestGems, refreshCurrency, creditPremiumCurrency, purchasePreset, currency StateFlow) ===" >> $OUT
          grep -n "grantTestGems\|refreshCurrency\|creditPremiumCurrency\|purchasePreset\|premiumCurrency\|_currency\|val currency\|softCurrency" -B 3 -A 20 ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT
          echo "" >> $OUT
          echo "=== MainActivity.kt: onGrantGems + ModerationScreen call site ===" >> $OUT
          grep -n "onGrantGems\|ModerationScreen(" -B 5 -A 5 ./app/src/main/kotlin/com/yourname/idlerpg/MainActivity.kt >> $OUT
          echo "" >> $OUT
          echo "=== filename holding AccountService class ===" >> $OUT
          grep -rl "class AccountService" ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT
          echo "" >> $OUT
          echo "=== AccountService/Account: premiumCurrency, addCurrency, purchasePreset, unlockedPresets ===" >> $OUT
          grep -n "premiumCurrency\|addCurrency\|purchasePreset\|unlockedPresets\|class Account\b" -B 2 -A 20 ./app/src/main/kotlin/com/yourname/idlerpg/*.kt >> $OUT
    artifacts:
      - discovery_output198.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_all_skill_backgrounds.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
