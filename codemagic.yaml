workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output67.txt
          echo "=== tickCombat() FULL body, generous line range ===" > $OUT
          sed -n '582,760p' ./app/src/main/kotlin/com/yourname/idlerpg/GameViewModel.kt >> $OUT || true
          echo "" >> $OUT
          echo "=== any attack-speed / cooldown / weapon speed fields ===" >> $OUT
          grep -rn "attackSpeed\|AttackSpeed\|cooldown\|Cooldown" ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NO MATCHES" >> $OUT
          echo "" >> $OUT
          echo "=== resolveAttack() definition in CombatService ===" >> $OUT
          grep -rn "fun resolveAttack" -A 30 ./app/src/main/kotlin/com/yourname/idlerpg/CombatService.kt >> $OUT || echo "FILE/FUNC NOT FOUND - check filename" >> $OUT
          echo "" >> $OUT
          echo "=== locate the actual OfflineIdleService file (previous grep found nothing - confirm correct filename) ===" >> $OUT
          find . -iname "*offline*" -name "*.kt" >> $OUT || true
    artifacts:
      - discovery_output67.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_bury_queue_and_prayer.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
