workflows:
  debug-build:
    name: Debug APK Build
    max_build_duration: 30
    environment:
      groups:
        - supabase_secrets
      vars:
        PACKAGE_NAME: "com.yourname.idlerpg"
      java: 17
    scripts:
      - name: Write local.properties
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> local.properties
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> local.properties
      - name: Build debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache
    artifacts:
      - app/build/outputs/apk/debug/*.apk

  discovery:
    name: Discovery Script
    max_build_duration: 10
    scripts:
      - name: Run discovery grep
        script: |
          OUT=discovery_output80.txt
          echo "=== enum class Rarity ===" > $OUT
          grep -n "enum class Rarity" -A 10 ./app/src/main/kotlin/com/yourname/idlerpg/*.kt >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== sample of ItemDefinition catalog entries with skillRequired set - to see exact string format ===" >> $OUT
          grep -rn "skillRequired = " ./app/src/main/kotlin/com/yourname/idlerpg/ | head -40 >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== find the item catalog object itself (name/location) ===" >> $OUT
          grep -rln "object ItemCatalog\|val allItems" ./app/src/main/kotlin/com/yourname/idlerpg/ >> $OUT || echo "NOT FOUND" >> $OUT
          echo "" >> $OUT
          echo "=== is there a guild member cap constant used by the LIVE (non-dead) guild code or UI? ===" >> $OUT
          grep -rn "MAX_MEMBERS\|maxMembers\|member.*cap\|20" ./app/src/main/kotlin/com/yourname/idlerpg/GuildCreateJoinScreen.kt ./app/src/main/kotlin/com/yourname/idlerpg/GuildHomeScreen.kt >> $OUT || echo "NOT FOUND" >> $OUT
    artifacts:
      - discovery_output80.txt
      
  apply-patch:
    name: Apply Patch Script
    max_build_duration: 10
    environment:
      groups:
        - supabase_secrets
    scripts:
      - name: Run patch scripts
        script: |
          python3 patch_bury_queue_and_prayer.py
      - name: Commit and push
        script: |
          git config user.email "codemagic@example.com"
          git config user.name "Codemagic Bot"
          git add -A
          git commit -m "Apply patch scripts" || echo "Nothing to commit"
          git push https://x-access-token:$GH_PAT@github.com/nateomach1-debug/Idle-Text-based-.git main
