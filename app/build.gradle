name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write local.properties from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties

      - name: Verify secret format (no values exposed)
        run: |
          echo "URL length: ${#SUPABASE_URL_CHECK}"
          echo "URL starts with https://: $(echo "$SUPABASE_URL_CHECK" | grep -c '^https://')"
          echo "URL ends with .supabase.co: $(echo "$SUPABASE_URL_CHECK" | grep -c '\.supabase\.co$')"
          echo "Anon key length: ${#SUPABASE_ANON_KEY_CHECK}"
        env:
          SUPABASE_URL_CHECK: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY_CHECK: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
